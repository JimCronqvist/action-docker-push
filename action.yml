name: 'Build and push Docker image'
description: 'Build and push a single Docker image to GitHub Container Registry, ghcr.io.'

inputs:
  token:
    description: 'GitHub Token {{ secrets.GITHUB_TOKEN }} with permission to publish packages to GHCR (packages: write).'
    required: true
  context:
    description: 'Docker build context. Defaults to the checked-out repository directory.'
    required: false
    default: '.'
  dockerfile:
    description: 'Path to the Dockerfile, relative to the repository root.'
    required: false
    default: 'Dockerfile'
  build-args:
    description: 'List of Docker build arguments, one per line (KEY=value). Do not use for secrets.'
    required: false
  secrets:
    description: 'List of BuildKit secrets, one per line (KEY=value), available only when explicitly mounted in the Dockerfile.'
    required: false
  provenance:
    description: 'Add provenance attestations to include facts about the build process to the built images'
    required: false
    default: 'false'
  sbom:
    description: 'Generate a Software Bill of Materials (SBOM) attestation for the Docker image for vulnerability scanning and license compliance.'
    required: false
    default: 'true'
  platforms:
    description: 'List of target platforms for build'
    required: false
  pull-requests:
    description: 'Whether to push images for pull request builds. Builds still run when false.'
    required: false
    default: 'false'
  load:
    description: 'Load image into local Docker daemon if not pushing (single platform only).'
    required: false
    default: 'false'
  image-name:
    description: 'Docker image name in the format <org>/<repo>. Default is {{ github.repository }}'
    required: false
    default: ${{ github.repository }}
  cache-from:
    description: 'External cache sources for buildx'
    required: false
    default: '' # 'type=gha'
  cache-to:
    description: 'Cache export destinations for buildx'
    required: false
    default: 'type=inline' # 'type=gha,mode=max,ignore-error=true'

outputs:
  image-id:
    description: 'Docker image ID'
    value: ${{ steps.build.outputs.imageid }}
  digest:
    description: 'Docker image digest'
    value: ${{ steps.build.outputs.digest }}
  metadata:
    description: 'Docker build result metadata'
    value: ${{ steps.build.outputs.metadata }}
  tags:
    description: 'Generated Docker image tags, one per line'
    value: ${{ steps.tags.outputs.tags }}

runs:
  using: "composite"
  steps:
    - name: Set up QEMU for platform emulation support
      if: ${{ inputs.platforms != '' }}
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      if: ${{ !contains(fromJSON('["pull_request","pull_request_target"]'), github.event_name) || inputs.pull-requests == 'true' }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ inputs.image-name }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
      #env:
      #  # Ensures OCI annotations attach to both root multi-arch index and individual manifests
      #  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

    - name: Lowercase the tags
      id: tags
      shell: bash
      run: |
        echo 'tags<<EOF' >> $GITHUB_OUTPUT
        echo '${{ steps.meta.outputs.tags }}' | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT
        echo 'EOF' >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: ${{ !contains(fromJSON('["pull_request","pull_request_target"]'), github.event_name) || inputs.pull-requests == 'true' }}
        provenance: ${{ inputs.provenance }}
        sbom: ${{ inputs.sbom }}
        platforms: ${{ inputs.platforms }}
        tags: ${{ steps.tags.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        load: ${{ inputs.load }}
        secrets: |
          ${{ inputs.secrets }}
        cache-from: |
          ${{ inputs.cache-from }}
        cache-to: |
          ${{ inputs.cache-to }}
        build-args: |
          ${{ inputs.build-args }}
